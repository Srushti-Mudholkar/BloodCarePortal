apiVersion: apps/v1
kind: Deployment
metadata:
  name: bloodcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bloodcare
  template:
    metadata:
      labels:
        app: bloodcare
    spec:
      containers:
        - name: bloodcare
          image: srushti012/bloodcare-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: bloodcare-env
---
apiVersion: v1
kind: Service
metadata:
  name: bloodcare-service
spec:
  type: NodePort
  selector:
    app: bloodcare
  ports:
    - port: 8080
      targetPort: 8080
