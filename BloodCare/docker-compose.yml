services:
  # Service 1: MongoDB database
  mongodb:
    image: mongo:7
    container_name: bloodcare-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Service 2: Backend (Node.js + Express)
  backend:
    build: .
    container_name: bloodcare-backend
    ports:
      - "8080:8080"
      
    env_file:
      - .env
    environment:
      - MONGO_URL=mongodb://mongodb:27017/bloodcare
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  # Service 3: Frontend (React + Nginx)
  frontend:
    build: ./client
    container_name: bloodcare-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

    # Service 4: Redis
  redis:
      image: redis:alpine
      container_name: bloodcare-redis
      ports:
        - "6379:6379"

volumes:
  mongo-data:
